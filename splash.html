<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>启动中...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        .splash-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .splash-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 铺满屏幕，不变形（可能裁剪边缘） */
        }
    </style>
    <script>
        setTimeout(function() {
            window.location.href = 'https://www.yingtux.cn';
        }, 3000);
    </script>
</head>
<body>
    <div class="splash-container">
        <img class="splash-image" src="img/splash.png" alt="启动画面" onerror="this.style.display='none'; document.body.style.backgroundColor='white';">
    </div>
</body>
</html>
