name: Package Website into Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型 (debug / release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova and create project
        run: |
          npm install -g cordova
          cordova create webapp com.yingtux.app 影图空间
          cd webapp
          sed -i 's|<content src="index.html" />|<content src="ad.html" />|' config.xml
          cordova platform add android
          cordova plugin add cordova-plugin-splashscreen

      - name: Run build script
        id: build
        run: bash scripts/build.sh ${{ github.event.inputs.build_type || 'debug' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-website-app-${{ github.event.inputs.build_type || 'debug' }}
          path: ${{ steps.build.outputs.apk_path }}
