name: Package Website into Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型 (debug / release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova and create project
        run: |
          npm install -g cordova
          cordova create webapp com.yingtux.app 影图空间
          cd webapp
          sed -i 's|<content src="index.html" />|<content src="ad.html" />|' config.xml
          cordova platform add android
          cordova plugin add cordova-plugin-splashscreen

      - name: Generate icons and splash screens
        run: |
          cd webapp
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p res/icon/android res/screen/android

          # 生成图标
          if [ -f "../logo.png" ]; then
            for size in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $size in mdpi) res=48 ;; hdpi) res=72 ;; xhdpi) res=96 ;; xxhdpi) res=144 ;; xxxhdpi) res=192 ;; esac
              convert ../logo.png -resize ${res}x${res} res/icon/android/icon-$size.png
            done
          else
            echo "错误：缺少 logo.png"
            exit 1
          fi

          # 生成启动画面
          if [ -f "../splash.png" ]; then
            for size in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $size in mdpi) w=320;h=480 ;; hdpi) w=480;h=800 ;; xhdpi) w=720;h=1280 ;; xxhdpi) w=960;h=1600 ;; xxxhdpi) w=1280;h=1920 ;; esac
              convert ../splash.png -resize ${w}x${h}^ -gravity center -background white -extent ${w}x${h} res/screen/android/splash-$size.png
            done
          else
            echo "错误：缺少 splash.png"
            exit 1
          fi

          echo "图标和启动画面生成完成"

      # 调用独立的脚本文件更新 config.xml
      - name: Configure icons and splash in config.xml
        run: bash scripts/update_config.sh

      - name: Create ad.html (splash ad page)
        run: |
          cd webapp/www
          cat > ad.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>开屏广告</title>
    <style>
        body { margin:0; padding:0; background:#fff; font-family:sans-serif; }
        .container { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
        .ad-image { max-width:90%; max-height:70vh; margin-bottom:20px; }
        .countdown { font-size:18px; color:#666; margin-top:20px; }
        .skip-btn { margin-top:30px; padding:10px 30px; background:#007aff; color:#fff; border:none; border-radius:5px; font-size:16px; cursor:pointer; }
    </style>
</head>
<body>
    <div class="container">
        <img id="adImage" class="ad-image" style="display:none;" />
        <div id="adText" style="font-size:24px; font-weight:bold; color:#333;">🎉 精彩广告位 🎉</div>
        <p style="color:#888;">5秒后自动进入网站</p>
        <div class="countdown" id="countdown">5 秒后跳转</div>
        <button class="skip-btn" onclick="skipAd()">立即跳过</button>
    </div>
    <script>
        var img = new Image();
        img.onload = function() {
            document.getElementById('adImage').src = 'img/ad.png';
            document.getElementById('adImage').style.display = 'block';
            document.getElementById('adText').style.display = 'none';
        };
        img.onerror = function() { };
        img.src = 'img/ad.png';

        var seconds = 5;
        var countdownEl = document.getElementById('countdown');
        var timer = setInterval(function() {
            seconds--;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = 'https://www.yingtux.cn';
            } else {
                countdownEl.innerText = seconds + ' 秒后跳转';
            }
        }, 1000);

        function skipAd() {
            clearInterval(timer);
            window.location.href = 'https://www.yingtux.cn';
        }
    </script>
</body>
</html>
EOF

          mkdir -p img
          if [ -f "../../ad.png" ]; then cp ../../ad.png img/ad.png; fi
          cd ../..

      - name: Build APK
        id: build
        run: |
          cd webapp
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then BUILD_TYPE="debug"; fi
          echo "构建类型: $BUILD_TYPE"
          cordova build android --$BUILD_TYPE --verbose
          if [ "$BUILD_TYPE" = "debug" ]; then
            APK_PATH="webapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_PATH="webapp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-website-app-${{ github.event.inputs.build_type || 'debug' }}
          path: ${{ steps.build.outputs.apk_path }}
