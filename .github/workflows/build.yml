name: Package Website into Android APK (with Icon & Splash)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies (ImageMagick)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create Cordova project
        run: |
          npm install -g cordova
          cordova create webapp com.yingtux.app 影图
          cd webapp
          # 设置起始页
          sed -i 's|<content src="index.html" />|<content src="https://www.yingtux.cn" />|' config.xml
          # 添加基础网络权限
          sed -i '/<widget/ a \    <access origin="*" />' config.xml
          # 添加 Android 平台和启动画面插件
          cordova platform add android
          cordova plugin add cordova-plugin-splashscreen

      - name: Generate icons and splash screens
        run: |
          cd webapp
          mkdir -p res/icon/android res/screen/android

          # 图标生成
          if [ -f "../logo.png" ]; then
            convert ../logo.png -resize 48x48 res/icon/android/icon-mdpi.png
            convert ../logo.png -resize 72x72 res/icon/android/icon-hdpi.png
            convert ../logo.png -resize 96x96 res/icon/android/icon-xhdpi.png
            convert ../logo.png -resize 144x144 res/icon/android/icon-xxhdpi.png
            convert ../logo.png -resize 192x192 res/icon/android/icon-xxxhdpi.png
            echo "图标生成成功"
          else
            echo "警告：根目录缺少 logo.png，跳过图标生成"
          fi

          # 启动画面生成（文件名统一为 splash-<density>.png）
          if [ -f "../img/splash.png" ]; then
            convert ../img/splash.png -resize 320x480^ -gravity center -background white -extent 320x480 res/screen/android/splash-mdpi.png
            convert ../img/splash.png -resize 480x800^ -gravity center -background white -extent 480x800 res/screen/android/splash-hdpi.png
            convert ../img/splash.png -resize 720x1280^ -gravity center -background white -extent 720x1280 res/screen/android/splash-xhdpi.png
            convert ../img/splash.png -resize 960x1600^ -gravity center -background white -extent 960x1600 res/screen/android/splash-xxhdpi.png
            convert ../img/splash.png -resize 1280x1920^ -gravity center -background white -extent 1280x1920 res/screen/android/splash-xxxhdpi.png
            echo "启动画面生成成功"
          else
            echo "警告：img/splash.png 不存在，跳过启动画面生成"
          fi

      - name: Display generated files
        run: |
          cd webapp
          echo "=== 图标文件 ==="
          ls -la res/icon/android/
          echo "=== 启动画面文件 ==="
          ls -la res/screen/android/

      - name: Modify config.xml (insert at correct position)
        run: |
          cd webapp
          cp config.xml config.xml.bak
          # 在 <widget> 标签内第一行后插入图标和启动画面配置
          # 先找到 <widget 所在行，并在其第一个 > 后插入新行
          awk '/<widget/ {print; print "    <icon density=\"mdpi\" src=\"res/icon/android/icon-mdpi.png\" />"; print "    <icon density=\"hdpi\" src=\"res/icon/android/icon-hdpi.png\" />"; print "    <icon density=\"xhdpi\" src=\"res/icon/android/icon-xhdpi.png\" />"; print "    <icon density=\"xxhdpi\" src=\"res/icon/android/icon-xxhdpi.png\" />"; print "    <icon density=\"xxxhdpi\" src=\"res/icon/android/icon-xxxhdpi.png\" />"; print "    <splash density=\"mdpi\" src=\"res/screen/android/splash-mdpi.png\" />"; print "    <splash density=\"hdpi\" src=\"res/screen/android/splash-hdpi.png\" />"; print "    <splash density=\"xhdpi\" src=\"res/screen/android/splash-xhdpi.png\" />"; print "    <splash density=\"xxhdpi\" src=\"res/screen/android/splash-xxhdpi.png\" />"; print "    <splash density=\"xxxhdpi\" src=\"res/screen/android/splash-xxxhdpi.png\" />"; next}1' config.xml > config.xml.new
          mv config.xml.new config.xml

          # 添加启动画面首选项（直接追加到文件末尾，或插入到合适位置，这里简单追加到 <widget> 块后，但为了安全，我们追加到文件末尾）
          cat <<EOF >> config.xml
    <preference name="SplashScreen" value="splash" />
    <preference name="SplashScreenDelay" value="3000" />
    <preference name="AutoHideSplashScreen" value="true" />
    <preference name="FadeSplashScreen" value="false" />
    <preference name="ShowSplashScreenSpinner" value="false" />
    <allow-navigation href="https://www.yingtux.cn/*" />
EOF
          # 确保这些内容在 </widget> 之前，但因为追加在末尾，可能需要调整，简单起见，我们直接追加，Cordova 应该能接受
          # 但为了更规范，可以尝试插入到 </widget> 前，但追加通常也可工作，因为 preference 和 allow-navigation 是 <widget> 的子元素，可以出现在文件末尾。
          echo "config.xml 修改完成"
          head -30 config.xml

      - name: Build APK
        run: |
          cd webapp
          cordova build android --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-website-app-with-splash-3s
          path: webapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
