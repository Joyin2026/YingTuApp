name: Package Website into Android APK (with Icon & Splash)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create webapp com.yingtux.app 影图
          cd webapp
          sed -i 's|<content src="index.html" />|<content src="https://www.yingtux.cn" />|' config.xml
          sed -i '/<widget/ a \    <access origin="*" />' config.xml
          cordova platform add android
          cordova plugin add cordova-plugin-splashscreen

      - name: Generate icons
        run: |
          cd webapp
          mkdir -p res/icon/android
          if [ -f "../logo.png" ]; then
            convert ../logo.png -resize 48x48 res/icon/android/icon-mdpi.png
            convert ../logo.png -resize 72x72 res/icon/android/icon-hdpi.png
            convert ../logo.png -resize 96x96 res/icon/android/icon-xhdpi.png
            convert ../logo.png -resize 144x144 res/icon/android/icon-xxhdpi.png
            convert ../logo.png -resize 192x192 res/icon/android/icon-xxxhdpi.png
          fi

      - name: Generate splash screens
        run: |
          cd webapp
          mkdir -p res/screen/android
          if [ -f "../img/splash.png" ]; then
            convert ../img/splash.png -resize 320x480^ -gravity center -background white -extent 320x480 res/screen/android/splash-mdpi.png
            convert ../img/splash.png -resize 480x800^ -gravity center -background white -extent 480x800 res/screen/android/splash-hdpi.png
            convert ../img/splash.png -resize 720x1280^ -gravity center -background white -extent 720x1280 res/screen/android/splash-xhdpi.png
            convert ../img/splash.png -resize 960x1600^ -gravity center -background white -extent 960x1600 res/screen/android/splash-xxhdpi.png
            convert ../img/splash.png -resize 1280x1920^ -gravity center -background white -extent 1280x1920 res/screen/android/splash-xxxhdpi.png
          fi

      - name: Insert icon and splash config into config.xml
        run: |
          cd webapp
          # 备份
          cp config.xml config.xml.bak
          # 在 <widget> 后插入图标和启动画面配置（使用 sed 一次性插入多行）
          sed -i '/<widget/ a\    <icon density="mdpi" src="res/icon/android/icon-mdpi.png" />\n    <icon density="hdpi" src="res/icon/android/icon-hdpi.png" />\n    <icon density="xhdpi" src="res/icon/android/icon-xhdpi.png" />\n    <icon density="xxhdpi" src="res/icon/android/icon-xxhdpi.png" />\n    <icon density="xxxhdpi" src="res/icon/android/icon-xxxhdpi.png" />\n    <splash density="mdpi" src="res/screen/android/splash-mdpi.png" />\n    <splash density="hdpi" src="res/screen/android/splash-hdpi.png" />\n    <splash density="xhdpi" src="res/screen/android/splash-xhdpi.png" />\n    <splash density="xxhdpi" src="res/screen/android/splash-xxhdpi.png" />\n    <splash density="xxxhdpi" src="res/screen/android/splash-xxxhdpi.png" />' config.xml

      - name: Add splash preferences and allow-navigation
        run: |
          cd webapp
          sed -i '/<widget/ a\    <preference name="SplashScreen" value="splash" />\n    <preference name="SplashScreenDelay" value="3000" />\n    <preference name="AutoHideSplashScreen" value="true" />\n    <preference name="FadeSplashScreen" value="false" />\n    <preference name="ShowSplashScreenSpinner" value="false" />\n    <allow-navigation href="https://www.yingtux.cn/*" />' config.xml

      - name: Copy splash images to native platform directories
        run: |
          cd webapp
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            if [ -f "res/screen/android/splash-${density}.png" ]; then
              mkdir -p platforms/android/app/src/main/res/drawable-${density}
              cp res/screen/android/splash-${density}.png platforms/android/app/src/main/res/drawable-${density}/splash.png
            fi
          done

      - name: Build APK
        run: |
          cd webapp
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-app-with-splash
          path: webapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
