name: Build Cordova APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型 (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pillow
          npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create webapp com.yingtux.app 影图空间
          cd webapp
          # 初始设置起始页为网站，但之后可能被覆盖
          sed -i 's|<content src="[^"]*" />|<content src="https://www.yingtux.cn" />|' config.xml
          cordova platform add android
          cordova plugin add cordova-plugin-splashscreen

      - name: Prepare resources with Python
        run: python scripts/prepare_resources.py

      # 关键步骤：直接修改平台下的最终 config.xml
      - name: Force correct content src in platform config
        run: |
          cd webapp
          CONFIG_FILE="platforms/android/app/src/main/res/xml/config.xml"
          if [ -f "$CONFIG_FILE" ]; then
            echo "修改前 content 行:"
            grep '<content' "$CONFIG_FILE" || true
            sed -i 's|<content src="[^"]*" />|<content src="https://www.yingtux.cn" />|' "$CONFIG_FILE"
            echo "修改后 content 行:"
            grep '<content' "$CONFIG_FILE"
          else
            echo "错误：找不到 $CONFIG_FILE"
            exit 1
          fi

      - name: Build APK
        id: build
        run: |
          cd webapp
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          cordova build android --$BUILD_TYPE --verbose
          if [ "$BUILD_TYPE" = "debug" ]; then
            APK_PATH="webapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_PATH="webapp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-app-${{ github.event.inputs.build_type || 'debug' }}
          path: ${{ steps.build.outputs.apk_path }}
