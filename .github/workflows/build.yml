name: Build Cordova APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型 (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create YingTuSpace com.yingtux.app "影图空间"
          cd YingTuSpace
          # 设置起始页为 ad.html
          sed -i 's|<content src="index.html" />|<content src="ad.html" />|' config.xml
          cordova platform add android
          cordova plugin add cordova-plugin-splashscreen

      - name: Build APK
        id: build
        run: |
          cd YingTuSpace
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          cordova build android --$BUILD_TYPE --verbose
          if [ "$BUILD_TYPE" = "debug" ]; then
            APK_PATH="YingTuSpace/platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_PATH="YingTuSpace/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-app-${{ github.event.inputs.build_type || 'debug' }}
          path: ${{ steps.build.outputs.apk_path }}
