name: Build APK with Capacitor

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型 (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pillow
          npm install -g @capacitor/cli @capacitor/core @capacitor/android

      - name: Prepare web assets
        run: |
          mkdir -p www/img
          # 生成默认广告页
          cat > www/ad.html << 'EOF'
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>广告</title><script>setTimeout(()=>{location.href='https://www.yingtux.cn';},5000);function skip(){location.href='https://www.yingtux.cn';}</script></head>
<body style="text-align:center;padding-top:20vh;"><h1>开屏广告</h1><p>5秒后进入网站</p><button onclick="skip()">跳过</button></body>
</html>
EOF
          # 复制广告图（如果有）
          if [ -f "img/ad.png" ]; then cp img/ad.png www/img/; fi
          # 准备启动画面（后续复制到原生目录）
          if [ -f "img/splash.png" ]; then
            mkdir -p android/app/src/main/res/drawable
            cp img/splash.png android/app/src/main/res/drawable/splash.png
          fi

      - name: Generate icons
        run: |
          if [ ! -f "logo.png" ]; then echo "缺少logo.png" && exit 1; fi
          mkdir -p android/app/src/main/res
          for size in 48 72 96 144 192; do
            folder="mipmap-$( [ $size -eq 48 ] && echo "mdpi"; [ $size -eq 72 ] && echo "hdpi"; [ $size -eq 96 ] && echo "xhdpi"; [ $size -eq 144 ] && echo "xxhdpi"; [ $size -eq 192 ] && echo "xxxhdpi" )"
            mkdir -p "android/app/src/main/res/$folder"
            convert logo.png -resize ${size}x${size} "android/app/src/main/res/$folder/ic_launcher.png"
          done

      - name: Init Capacitor
        run: |
          npx cap init YingTuSpace com.yingtux.app --web-dir www
          npx cap add android
          # 直接修改配置，使应用加载网站
          sed -i 's|"server": {}|"server": { "url": "https://www.yingtux.cn", "cleartext": true }|' capacitor.config.json

      - name: Sync and copy
        run: npx cap copy

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-app-${{ github.event.inputs.build_type }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
