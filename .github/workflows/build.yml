name: Minimal Capacitor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify Java version
        run: java -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli

      - name: Initialize npm project
        run: npm init -y

      - name: Create minimal web assets
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Loading...</title></head><body>Redirecting...</body></html>' > www/index.html

      - name: Install Capacitor Android locally
        run: npm install @capacitor/android

      - name: Initialize Capacitor project
        run: npx cap init YingTuApp com.yingtux.app --web-dir www

      - name: Add Android platform
        run: npx cap add android

      - name: Configure app to load your website directly
        run: |
          sed -i 's|"server": {}|"server": { "url": "https://www.yingtux.cn", "cleartext": true }|' capacitor.config.json

      - name: Fix Kotlin version conflict in build.gradle
        run: |
          # 在 android/app/build.gradle 中添加 resolutionStrategy 强制使用统一版本
          echo "" >> android/app/build.gradle
          echo "configurations.all {" >> android/app/build.gradle
          echo "    resolutionStrategy {" >> android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'" >> android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle
          echo "已添加 Kotlin 版本强制配置"

      - name: Sync Capacitor
        run: npx cap copy

      - name: Build APK
        run: |
          cd android
          export JAVA_HOME=$JAVA_HOME_21_X64
          ./gradlew clean assembleDebug --no-daemon --refresh-dependencies
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
