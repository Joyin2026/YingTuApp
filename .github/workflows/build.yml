name: Build Minimal Capacitor App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify Java version
        run: java -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli

      - name: Initialize npm project and create web assets
        run: |
          npm init -y
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Test</title></head><body><h1>Hello from Capacitor!</h1></body></html>' > www/index.html

      - name: Install Capacitor Android locally
        run: npm install @capacitor/android

      - name: Initialize Capacitor project
        run: npx cap init "影图空间" "com.yingtux.app" --web-dir www

      - name: Add Android platform
        run: npx cap add android

      - name: Fix Kotlin version conflict
        run: |
          cd android/app
          # 在 build.gradle 末尾添加 resolutionStrategy
          cat >> build.gradle << 'EOF'

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
EOF
          echo "已添加 Kotlin 版本强制配置"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
