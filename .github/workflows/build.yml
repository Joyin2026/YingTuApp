name: Minimal Cordova APK - Load Website

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create testApp com.example.test TestApp
          cd testApp
          # 修改起始页
          sed -i 's|<content src="index.html" />|<content src="https://www.yingtux.cn" />|' config.xml
          # 添加全面的网络权限
          sed -i '/<widget/ a \    <access origin="*" />' config.xml
          sed -i '/<widget/ a \    <allow-navigation href="https://www.yingtux.cn/*" />' config.xml
          sed -i '/<widget/ a \    <allow-intent href="http://*/*" />' config.xml
          sed -i '/<widget/ a \    <allow-intent href="https://*/*" />' config.xml
          # 添加网络安全配置（允许所有内容）
          sed -i '/<widget/ a \    <preference name="AndroidInsecureFileModeEnabled" value="true" />' config.xml
          # 添加 platform 特定配置
          echo '<platform name="android">' >> config.xml
          echo '    <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application">' >> config.xml
          echo '        <application android:usesCleartextTraffic="true" />' >> config.xml
          echo '    </edit-config>' >> config.xml
          echo '</platform>' >> config.xml

          cordova platform add android
          # 安装 whitelist 插件
          cordova plugin add cordova-plugin-whitelist

      - name: Build APK
        run: |
          cd testApp
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-website-app
          path: testApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
