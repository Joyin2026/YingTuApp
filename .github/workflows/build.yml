name: Package Website into Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Cordova project
        run: |
          npm install -g cordova
          cordova create webapp com.yingtux.app 影途社
          cd webapp
          # 设置起始页为你的网站
          sed -i 's|<content src="index.html" />|<content src="https://www.yingtux.cn" />|' config.xml
          # 添加网络访问权限（关键！）
          sed -i '/<widget/ a \    <access origin="*" />' config.xml
          cordova platform add android

      # 可选：自定义应用图标（如果根目录有 logo.png）
      # - name: Customize App Icon
      #   run: |
      #     cd webapp
      #     mkdir -p platforms/android/app/src/main/res/mipmap-xxxhdpi/
      #     cp ../logo.png platforms/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      #     # 其他尺寸可自行补充

      - name: Build APK
        run: |
          cd webapp
          cordova build android --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-website-app
          path: webapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
