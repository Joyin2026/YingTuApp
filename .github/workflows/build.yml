name: Package Website with Local Splash Page

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create webapp com.yingtux.app 影图网
          cd webapp
          # 先不设起始页，稍后覆盖 index.html
          cordova platform add android

      - name: Generate icons
        run: |
          cd webapp
          mkdir -p res/icon/android
          if [ -f "../logo.png" ]; then
            convert ../logo.png -resize 48x48 res/icon/android/icon-mdpi.png
            convert ../logo.png -resize 72x72 res/icon/android/icon-hdpi.png
            convert ../logo.png -resize 96x96 res/icon/android/icon-xhdpi.png
            convert ../logo.png -resize 144x144 res/icon/android/icon-xxhdpi.png
            convert ../logo.png -resize 192x192 res/icon/android/icon-xxxhdpi.png
          fi

      - name: Create local splash page
        run: |
          cd webapp/www
          # 复制启动图片到 www/img/ 目录
          mkdir -p img
          if [ -f "../../img/splash.png" ]; then
            cp ../../img/splash.png img/splash.png
          else
            echo "警告：缺少 img/splash.png，将使用纯色背景"
          fi

          # 生成 index.html，全屏显示启动图片，3秒后跳转
          cat > index.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>启动中...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        .splash-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .splash-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 确保图片铺满屏幕，不变形（可能裁剪边缘） */
        }
    </style>
    <script>
        // 3秒后跳转到网站
        setTimeout(function() {
            window.location.href = 'https://www.yingtux.cn';
        }, 3000);
    </script>
</head>
<body>
    <div class="splash-container">
        <img class="splash-image" src="img/splash.png" alt="启动画面" onerror="this.style.display='none'; document.body.style.backgroundColor='white';">
    </div>
</body>
</html>
EOF

      - name: Insert icon config into config.xml
        run: |
          cd webapp
          cp config.xml config.xml.bak
          sed -i '/<widget/ a\    <icon density="mdpi" src="res/icon/android/icon-mdpi.png" />\n    <icon density="hdpi" src="res/icon/android/icon-hdpi.png" />\n    <icon density="xhdpi" src="res/icon/android/icon-xhdpi.png" />\n    <icon density="xxhdpi" src="res/icon/android/icon-xxhdpi.png" />\n    <icon density="xxxhdpi" src="res/icon/android/icon-xxxhdpi.png" />' config.xml

      - name: Build APK
        run: |
          cd webapp
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-app-with-local-splash
          path: webapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
