name: Package Website into Android APK (with Icon & Splash)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies (ImageMagick)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create Cordova project
        run: |
          npm install -g cordova
          # 应用名称改为“影图”
          cordova create webapp com.yingtux.app 影图
          cd webapp
          # 设置起始页为你的网站
          sed -i 's|<content src="index.html" />|<content src="https://www.yingtux.cn" />|' config.xml
          # 添加网络访问权限
          sed -i '/<widget/ a \    <access origin="*" />' config.xml
          # 添加 Android 平台和启动画面插件
          cordova platform add android
          cordova plugin add cordova-plugin-splashscreen

      - name: Generate icons and splash screens
        run: |
          cd webapp
          mkdir -p res/icon/android res/screen/android

          # 图标生成（从根目录 logo.png）
          if [ -f "../logo.png" ]; then
            convert ../logo.png -resize 48x48 res/icon/android/icon-mdpi.png
            convert ../logo.png -resize 72x72 res/icon/android/icon-hdpi.png
            convert ../logo.png -resize 96x96 res/icon/android/icon-xhdpi.png
            convert ../logo.png -resize 144x144 res/icon/android/icon-xxhdpi.png
            convert ../logo.png -resize 192x192 res/icon/android/icon-xxxhdpi.png
          else
            echo "警告：根目录缺少 logo.png，跳过图标生成"
          fi

          # 启动画面生成（从 img/splash.png）
          if [ -f "../img/splash.png" ]; then
            convert ../img/splash.png -resize 320x480^ -gravity center -background white -extent 320x480 res/screen/android/splash-mdpi.png
            convert ../img/splash.png -resize 480x800^ -gravity center -background white -extent 480x800 res/screen/android/splash-hdpi.png
            convert ../img/splash.png -resize 720x1280^ -gravity center -background white -extent 720x1280 res/screen/android/splash-xhdpi.png
            convert ../img/splash.png -resize 960x1600^ -gravity center -background white -extent 960x1600 res/screen/android/splash-xxhdpi.png
            convert ../img/splash.png -resize 1280x1920^ -gravity center -background white -extent 1280x1920 res/screen/android/splash-xxxhdpi.png
          else
            echo "警告：img/splash.png 不存在，跳过启动画面生成"
          fi

      - name: Modify config.xml (add icon, splash, preferences)
        run: |
          cd webapp
          # 备份原文件
          cp config.xml config.xml.bak

          # 在 <widget> 标签后插入图标和启动画面配置
          sed -i '/<widget/ a \    <icon density="mdpi" src="res/icon/android/icon-mdpi.png" />\n    <icon density="hdpi" src="res/icon/android/icon-hdpi.png" />\n    <icon density="xhdpi" src="res/icon/android/icon-xhdpi.png" />\n    <icon density="xxhdpi" src="res/icon/android/icon-xxhdpi.png" />\n    <icon density="xxxhdpi" src="res/icon/android/icon-xxxhdpi.png" />\n    <splash density="mdpi" src="res/screen/android/splash-mdpi.png" />\n    <splash density="hdpi" src="res/screen/android/splash-hdpi.png" />\n    <splash density="xhdpi" src="res/screen/android/splash-xhdpi.png" />\n    <splash density="xxhdpi" src="res/screen/android/splash-xxhdpi.png" />\n    <splash density="xxxhdpi" src="res/screen/android/splash-xxxhdpi.png" />' config.xml

          # 添加启动画面首选项（关键：设置自动隐藏）
          sed -i '/<widget/ a \    <preference name="SplashScreen" value="screen" />\n    <preference name="SplashScreenDelay" value="5000" />\n    <preference name="AutoHideSplashScreen" value="true" />\n    <preference name="FadeSplashScreen" value="false" />\n    <preference name="ShowSplashScreenSpinner" value="false" />' config.xml

          # 添加 allow-navigation
          sed -i '/<widget/ a \    <allow-navigation href="https://www.yingtux.cn/*" />' config.xml

          echo "config.xml 已更新"

      - name: Copy resources to platform (ensuring they are included)
        run: |
          cd webapp
          # 复制生成的启动画面到平台目录（确保插件能找到）
          mkdir -p platforms/android/app/src/main/res/drawable-port-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}
          if [ -f "res/screen/android/splash-mdpi.png" ]; then
            cp res/screen/android/splash-mdpi.png platforms/android/app/src/main/res/drawable-port-mdpi/splash.png
            cp res/screen/android/splash-hdpi.png platforms/android/app/src/main/res/drawable-port-hdpi/splash.png
            cp res/screen/android/splash-xhdpi.png platforms/android/app/src/main/res/drawable-port-xhdpi/splash.png
            cp res/screen/android/splash-xxhdpi.png platforms/android/app/src/main/res/drawable-port-xxhdpi/splash.png
            cp res/screen/android/splash-xxxhdpi.png platforms/android/app/src/main/res/drawable-port-xxxhdpi/splash.png
          fi

      - name: Build APK
        run: |
          cd webapp
          cordova build android --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-website-app-with-splash
          path: webapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
