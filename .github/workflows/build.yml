name: Minimal Capacitor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: npm install -g @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize npm project
        run: npm init -y

      - name: Create minimal web assets
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Loading...</title></head><body>Redirecting...</body></html>' > www/index.html

      - name: Initialize Capacitor project
        run: npx cap init YingTuApp com.yingtux.app --web-dir www

      - name: Add Android platform
        run: npx cap add android

      - name: Configure app to load your website directly
        run: |
          # 修改 capacitor.config.json，设置 server.url 为你的网站
          sed -i 's|"server": {}|"server": { "url": "https://www.yingtux.cn", "cleartext": true }|' capacitor.config.json

      - name: Sync Capacitor
        run: npx cap copy

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
