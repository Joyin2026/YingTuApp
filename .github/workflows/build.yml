name: Package Website with Local Splash and InAppBrowser

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create webapp com.yingtux.app 影图网
          cd webapp
          cordova platform add android
          # 添加 inappbrowser 插件，强制所有链接在应用内打开
          cordova plugin add cordova-plugin-inappbrowser

      - name: Generate icons
        run: |
          cd webapp
          mkdir -p res/icon/android
          if [ -f "../logo.png" ]; then
            convert ../logo.png -resize 48x48 res/icon/android/icon-mdpi.png
            convert ../logo.png -resize 72x72 res/icon/android/icon-hdpi.png
            convert ../logo.png -resize 96x96 res/icon/android/icon-xhdpi.png
            convert ../logo.png -resize 144x144 res/icon/android/icon-xxhdpi.png
            convert ../logo.png -resize 192x192 res/icon/android/icon-xxxhdpi.png
          fi

      - name: Copy splash page and image
        run: |
          cd webapp/www
          mkdir -p img
          # 使用您提供的 splash.html（确保该文件已在仓库根目录）
          cp ../../splash.html index.html
          cp ../../img/splash.png img/splash.png

      - name: Insert icon config into config.xml
        run: |
          cd webapp
          cp config.xml config.xml.bak
          sed -i '/<widget/ a\    <icon density="mdpi" src="res/icon/android/icon-mdpi.png" />\n    <icon density="hdpi" src="res/icon/android/icon-hdpi.png" />\n    <icon density="xhdpi" src="res/icon/android/icon-xhdpi.png" />\n    <icon density="xxhdpi" src="res/icon/android/icon-xxhdpi.png" />\n    <icon density="xxxhdpi" src="res/icon/android/icon-xxxhdpi.png" />' config.xml

      - name: Build APK
        run: |
          cd webapp
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-app-with-splash
          path: webapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
