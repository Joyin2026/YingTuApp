name: Package Website into Android APK (with Icon, no Splash)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies (ImageMagick)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create Cordova project
        run: |
          npm install -g cordova
          cordova create webapp com.yingtux.app 影图
          cd webapp
          sed -i 's|<content src="index.html" />|<content src="https://www.yingtux.cn" />|' config.xml
          sed -i '/<widget/ a \    <access origin="*" />' config.xml
          cordova platform add android

      - name: Generate icons
        run: |
          cd webapp
          mkdir -p res/icon/android
          if [ -f "../logo.png" ]; then
            convert ../logo.png -resize 48x48 res/icon/android/icon-mdpi.png
            convert ../logo.png -resize 72x72 res/icon/android/icon-hdpi.png
            convert ../logo.png -resize 96x96 res/icon/android/icon-xhdpi.png
            convert ../logo.png -resize 144x144 res/icon/android/icon-xxhdpi.png
            convert ../logo.png -resize 192x192 res/icon/android/icon-xxxhdpi.png
            echo "图标生成成功"
          else
            echo "警告：根目录缺少 logo.png，跳过图标生成"
          fi

      - name: Insert icon config into config.xml
        run: |
          cd webapp
          cp config.xml config.xml.bak
          sed -i '/<widget/ a\    <icon density="mdpi" src="res/icon/android/icon-mdpi.png" />\n    <icon density="hdpi" src="res/icon/android/icon-hdpi.png" />\n    <icon density="xhdpi" src="res/icon/android/icon-xhdpi.png" />\n    <icon density="xxhdpi" src="res/icon/android/icon-xxhdpi.png" />\n    <icon density="xxxhdpi" src="res/icon/android/icon-xxxhdpi.png" />' config.xml

      - name: Build APK
        run: |
          cd webapp
          cordova build android --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-website-app-with-icon
          path: webapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
