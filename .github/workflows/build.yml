name: Build Cordova APK with Splash and Ad

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型 (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pillow
          npm install -g cordova

      - name: Create Cordova project (English name)
        run: |
          cordova create webapp com.yingtux.app YingTuSpace
          cd webapp
          # 设置起始页为 ad.html
          sed -i 's|<content src="index.html" />|<content src="ad.html" />|' config.xml
          # 添加网络权限
          sed -i '/<allow-navigation/d' config.xml
          sed -i '/<access /d' config.xml
          sed -i 's|<widget|<widget\n    <access origin="*" />\n    <allow-navigation href="https://www.yingtux.cn/*" />|' config.xml
          cordova platform add android
          cordova plugin add cordova-plugin-splashscreen

      - name: Prepare resources with Python
        run: |
          cd webapp
          mkdir -p res/icon/android res/screen/android www/img

          # 生成图标（使用根目录 logo.png）
          if [ -f "../logo.png" ]; then
            for size in 48 72 96 144 192; do
              density=$([ $size -eq 48 ] && echo "mdpi" || [ $size -eq 72 ] && echo "hdpi" || [ $size -eq 96 ] && echo "xhdpi" || [ $size -eq 144 ] && echo "xxhdpi" || echo "xxxhdpi")
              convert ../logo.png -resize ${size}x${size} res/icon/android/icon-${density}.png
            done
          else
            echo "错误：缺少 logo.png"
            exit 1
          fi

          # 生成启动画面（使用 img/splash.png）
          if [ -f "../img/splash.png" ]; then
            for size in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $size in
                mdpi) w=320;h=480 ;;
                hdpi) w=480;h=800 ;;
                xhdpi) w=720;h=1280 ;;
                xxhdpi) w=960;h=1600 ;;
                xxxhdpi) w=1280;h=1920 ;;
              esac
              convert ../img/splash.png -resize ${w}x${h}^ -gravity center -background white -extent ${w}x${h} res/screen/android/splash-${size}.png
            done
          else
            echo "错误：缺少 img/splash.png"
            exit 1
          fi

          # 生成广告页面 ad.html
          cat > www/ad.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>开屏广告</title>
    <script src="cordova.js"></script>
    <style>
        body { margin:0; padding:0; background:#000; color:#fff; text-align:center; font-family:sans-serif; }
        .container { display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; }
        .ad-image { max-width:90%; max-height:70vh; border:2px solid #fff; }
        .countdown { font-size:24px; margin:20px; }
        .skip-btn { padding:15px 40px; background:#007aff; color:white; border:none; border-radius:8px; font-size:18px; cursor:pointer; }
    </style>
</head>
<body>
    <div class="container">
        <img id="adImage" class="ad-image" src="img/ad.png" onerror="this.style.display='none'; document.getElementById('adText').style.display='block';" style="display:block;" />
        <div id="adText" style="font-size:28px; font-weight:bold; display:none;">🎉 精彩广告位 🎉</div>
        <p>5秒后自动进入网站</p>
        <div class="countdown" id="countdown">5 秒后跳转</div>
        <button class="skip-btn" onclick="skipAd()">立即跳过</button>
    </div>
    <script>
        document.addEventListener('deviceready', function() {
            if (navigator.splashscreen) navigator.splashscreen.hide();
        }, false);
        var seconds = 5;
        var timer = setInterval(function() {
            seconds--;
            document.getElementById('countdown').innerText = seconds + ' 秒后跳转';
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = 'https://www.yingtux.cn';
            }
        }, 1000);
        function skipAd() {
            clearInterval(timer);
            window.location.href = 'https://www.yingtux.cn';
        }
    </script>
</body>
</html>
EOF

          # 复制广告图片
          if [ -f "../img/ad.png" ]; then
            cp ../img/ad.png www/img/ad.png
          else
            echo "警告：缺少 img/ad.png，广告页将只显示文字"
          fi

          # 修改 config.xml 添加图标和启动画面配置
          cp config.xml config.xml.bak
          # 插入图标配置
          sed -i '/<platform name="android">/a \        <icon density="mdpi" src="res/icon/android/icon-mdpi.png" />' config.xml
          sed -i '/<platform name="android">/a \        <icon density="hdpi" src="res/icon/android/icon-hdpi.png" />' config.xml
          sed -i '/<platform name="android">/a \        <icon density="xhdpi" src="res/icon/android/icon-xhdpi.png" />' config.xml
          sed -i '/<platform name="android">/a \        <icon density="xxhdpi" src="res/icon/android/icon-xxhdpi.png" />' config.xml
          sed -i '/<platform name="android">/a \        <icon density="xxxhdpi" src="res/icon/android/icon-xxxhdpi.png" />' config.xml

          # 插入启动画面配置
          sed -i '/<platform name="android">/a \        <splash density="mdpi" src="res/screen/android/splash-mdpi.png" />' config.xml
          sed -i '/<platform name="android">/a \        <splash density="hdpi" src="res/screen/android/splash-hdpi.png" />' config.xml
          sed -i '/<platform name="android">/a \        <splash density="xhdpi" src="res/screen/android/splash-xhdpi.png" />' config.xml
          sed -i '/<platform name="android">/a \        <splash density="xxhdpi" src="res/screen/android/splash-xxhdpi.png" />' config.xml
          sed -i '/<platform name="android">/a \        <splash density="xxxhdpi" src="res/screen/android/splash-xxxhdpi.png" />' config.xml

          # 添加启动画面首选项
          sed -i '/<widget/ a \    <preference name="SplashScreen" value="screen" />\n    <preference name="SplashScreenDelay" value="5000" />\n    <preference name="AutoHideSplashScreen" value="false" />' config.xml

          echo "资源准备完成"

      - name: Force correct content src in platform config
        run: |
          cd webapp
          CONFIG_FILE="platforms/android/app/src/main/res/xml/config.xml"
          if [ -f "$CONFIG_FILE" ]; then
            sed -i 's|<content src="[^"]*" />|<content src="ad.html" />|' "$CONFIG_FILE"
          fi

      - name: Build APK
        id: build
        run: |
          cd webapp
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          cordova build android --$BUILD_TYPE --verbose
          if [ "$BUILD_TYPE" = "debug" ]; then
            APK_PATH="webapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_PATH="webapp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-app-${{ github.event.inputs.build_type || 'debug' }}
          path: ${{ steps.build.outputs.apk_path }}
