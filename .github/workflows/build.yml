name: Minimal Cordova APK - Load Website

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create testApp com.example.test TestApp
          cd testApp
          # 修改 config.xml，将起始页设为您的网站
          sed -i 's|<content src="index.html" />|<content src="https://www.yingtux.cn" />|' config.xml
          # 添加网络权限
          sed -i '/<widget/ a \    <access origin="*" />' config.xml
          cordova platform add android

      - name: Build APK
        run: |
          cd testApp
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yingtu-website-app
          path: testApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
